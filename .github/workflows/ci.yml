name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -v
      - name: Offline session replay
        run: python -m scripts.session_cli replay examples/diagnostic-session.json --output "$RUNNER_TEMP/session.json"
      - name: Generate demo resources without GTK
        run: python -m scripts.demo --output "$RUNNER_TEMP/demo"
      - name: Execute native offline workflows and preserve native files
        run: python -m scripts.offline_verify workflows

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.7
      - run: ruff check scripts tests techstream.py
      - run: ruff format --check scripts tests techstream.py
      - run: shellcheck techstream scripts/desktop-smoke.sh

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libusb-1.0-0 gir1.2-gdkpixbuf-2.0 librsvg2-common xvfb dbus-x11
      - name: Create synthetic native vehicle replay inputs
        env:
          PYTHONPATH: tests:.
        run: |
          python3 - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          from scripts.drive_recorder import NativeTriggerInfo, NativeTriggerParameters
          from scripts.monitor_replay import MonitorReplay
          from tests.test_monitor_replay import (
              AuthoredCapture,
              NativeVehicleReplayTests,
              write_native_vehicle_smoke_fixture,
          )

          directory = Path(os.environ["RUNNER_TEMP"]) / "native-vehicle"
          recording, sources = write_native_vehicle_smoke_fixture(
              directory,
              trigger=NativeTriggerInfo((1, 0), 1, 1, 0),
              parameters=NativeTriggerParameters((1, 0), 1, 0, (1, 0), (), (1, 0), ()),
          )
          close_case = NativeVehicleReplayTests()
          try:
              close_directory = Path(os.environ["RUNNER_TEMP"]) / "native-vehicle-close-retry"
              close_sources, close_template = close_case.native_vehicle_document(close_directory)
              cancel_recordings = {}
              for stage in ("load", "selection"):
                  document = copy.deepcopy(close_template)
                  capture = AuthoredCapture(document)
                  replay = MonitorReplay(capture, close_sources)
                  replay.begin_native_vehicle(info_ids=(4,), text_encoding="cp1252")
                  if stage == "load":
                      replay.native_categories((), bus_judge=0)
                  else:
                      close_case.selection_path(replay, choose_categories=True)
                  replay.close_native_vehicle()
                  document["events"] = capture.captured
                  cancel_recordings[stage] = close_directory / f"{stage}-cancel.json"
                  cancel_recordings[stage].write_text(json.dumps(document), encoding="utf-8")
                  if stage == "selection":
                      close_case.append_disconnect_retry(document)
                      close_recording = close_directory / "close-retry.json"
                      close_recording.write_text(json.dumps(document), encoding="utf-8")
          finally:
              close_case.doCleanups()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.writelines(
                  f"TECHSTREAM_NATIVE_VEHICLE_SMOKE_{name}={value}\n"
                  for name, value in (
                      ("RECORDING", recording),
                      ("DRS", directory / "expected-recording.drs"),
                      ("SOURCE_ROOT", sources),
                  )
              )
              output.writelines(
                  f"TECHSTREAM_NATIVE_VEHICLE_CLOSE_RETRY_SMOKE_{name}={value}\n"
                  for name, value in (
                      ("RECORDING", close_recording),
                      ("SOURCE_ROOT", close_sources),
                  )
              )
              output.writelines(
                  f"TECHSTREAM_NATIVE_VEHICLE_{stage.upper()}_CANCEL_SMOKE_RECORDING={path}\n"
                  for stage, path in cancel_recordings.items()
              )
          PY
      - name: Render and exercise the synthetic demo
        run: sh scripts/desktop-smoke.sh normal
      - name: Render and exercise the synthetic demo in the compact layout
        run: sh scripts/desktop-smoke.sh compact

  public-root:
    name: public checkout and root gate
    runs-on: ubuntu-24.04
    container:
      image: python:3.12-slim
    steps:
      - name: Install the public runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Reject private evidence in the published tree
        run: |
          if find . -path ./.git -prune -o -type f \
            \( -path './analysis/*' -o -path './artifacts/*' -o -path './.unlazy/*' \
            -o -path './runtime/no-car-*' \) -print | grep -q .; then
            echo "Private evidence paths must not be published" >&2
            exit 1
          fi
      - name: Unit tests without a private corpus
        run: python3 -m unittest discover -s tests
      - name: Native offline workflows
        run: python3 -m scripts.offline_verify workflows
